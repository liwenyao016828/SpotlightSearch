name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/SpotlightSearch/SpotlightSearch.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -o publish/fdd

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/SpotlightSearch/SpotlightSearch.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none
          -p:EnableCompressionInSingleFile=true
          -o publish/scd

      - name: Zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -like 'v*') { "${{ github.ref_name }}" } else { "dev" }
          Compress-Archive -Path publish/fdd/* -DestinationPath "SpotlightSearch-$tag-win-x64-lite.zip"
          Compress-Archive -Path publish/scd/* -DestinationPath "SpotlightSearch-$tag-win-x64.zip"
          Get-ChildItem *.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SpotlightSearch-win-x64
          path: '*.zip'

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "SpotlightSearch-$tag-win-x64.zip" `
            "SpotlightSearch-$tag-win-x64-lite.zip" `
            --title "SpotlightSearch $tag" `
            --notes "两个包：
- SpotlightSearch-$tag-win-x64.zip — 自包含，无需 .NET 运行时（体积大）
- SpotlightSearch-$tag-win-x64-lite.zip — 需要已安装 .NET 10 Desktop Runtime（约 0.5 MB）"
